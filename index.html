<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매출 대시보드</title>
<style>
:root{
  --bg:#0d0f14;--s1:#14171f;--s2:#1c2030;--s3:#242840;
  --border:#2a2f45;--border2:#363d5a;
  --accent:#4f7cff;--accent2:#7b9fff;--accentd:rgba(79,124,255,.12);
  --text:#e2e6f6;--textd:#8892b4;--textm:#454d6a;
  --green:#3ecf8e;--greend:rgba(62,207,142,.12);
  --red:#f05b6a;--redd:rgba(240,91,106,.12);
  --yellow:#f5c518;--yellowd:rgba(245,197,24,.12);
  --purple:#a97bff;--purpled:rgba(169,123,255,.12);
  --orange:#ff8c42;--oranged:rgba(255,140,66,.12);
  --r:10px;--rs:6px;
}
.light{
  --bg:#f0f4ff;--s1:#ffffff;--s2:#f4f6fc;--s3:#e8ecf8;
  --border:#d0d6ec;--border2:#b0b8d8;
  --accent:#3a6af0;--accent2:#2655d8;--accentd:rgba(58,106,240,.08);
  --text:#1a1e2e;--textd:#5a627a;--textm:#9aa0b8;
  --green:#1ea870;--greend:rgba(30,168,112,.1);
  --red:#d94455;--redd:rgba(217,68,85,.1);
  --yellow:#c49a00;--yellowd:rgba(196,154,0,.1);
  --purple:#7b50d8;--purpled:rgba(123,80,216,.1);
  --orange:#d4660a;--oranged:rgba(212,102,10,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}

/* LOGIN */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-box{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:40px 36px;width:360px;text-align:center}
.login-logo{font-size:28px;font-weight:800;color:var(--accent);letter-spacing:-1px;margin-bottom:6px}
.login-sub{color:var(--textd);font-size:13px;margin-bottom:28px}
.login-input{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:11px 14px;font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;transition:border-color .15s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.login-btn:hover{filter:brightness(1.1)}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}

/* NAV */
#appWrap{display:none}
nav{background:var(--s1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;height:52px;position:sticky;top:0;z-index:100;gap:4px}
.nav-logo{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:-1px;margin-right:20px}
.nav-tab{padding:0 14px;height:52px;display:flex;align-items:center;font-size:13px;color:var(--textd);cursor:pointer;border-bottom:2px solid transparent;border-top:none;border-left:none;border-right:none;background:none;font-family:inherit;font-weight:500;transition:all .15s;gap:5px}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.nav-sp{flex:1}
.nav-btn{background:none;border:1px solid var(--border);border-radius:var(--rs);color:var(--textd);cursor:pointer;font-size:12px;padding:4px 10px;font-family:inherit;transition:all .15s}
.nav-btn:hover{color:var(--text);border-color:var(--border2)}

.page{display:none;padding:24px;max-width:1200px;margin:0 auto}
.page.active{display:block}

/* HEADER */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:18px;font-weight:700}
.page-date{font-size:12px;color:var(--textd);margin-top:2px}
.refresh-btn{background:var(--accentd);color:var(--accent2);border:1px solid rgba(79,124,255,.3);border-radius:var(--rs);padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.refresh-btn:hover{filter:brightness(1.1)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}

/* DATE BAR */
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.date-input{background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:6px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.date-input:focus{border-color:var(--accent)}
.date-btn{background:var(--s2);border:1px solid var(--border);border-radius:var(--rs);color:var(--textd);padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .15s}
.date-btn:hover,.date-btn.active{background:var(--accentd);color:var(--accent2);border-color:rgba(79,124,255,.4)}

/* KPI — 6 columns */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
@media(max-width:960px){.kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:580px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 14px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.kpi-card.blue::before{background:var(--accent)}
.kpi-card.green::before{background:var(--green)}
.kpi-card.yellow::before{background:var(--yellow)}
.kpi-card.red::before{background:var(--red)}
.kpi-card.purple::before{background:var(--purple)}
.kpi-card.orange::before{background:var(--orange)}
.kpi-label{font-size:10px;font-weight:600;color:var(--textm);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.kpi-value{font-size:18px;font-weight:800;line-height:1;margin-bottom:5px}
.kpi-card.blue .kpi-value{color:var(--accent2)}
.kpi-card.green .kpi-value{color:var(--green)}
.kpi-card.yellow .kpi-value{color:var(--yellow)}
.kpi-card.red .kpi-value{color:var(--red)}
.kpi-card.purple .kpi-value{color:var(--purple)}
.kpi-card.orange .kpi-value{color:var(--orange)}
.kpi-delta{font-size:11px;color:var(--textm)}
.delta-up{color:var(--green)}
.delta-dn{color:var(--red)}
.delta-eq{color:var(--textm)}

/* GRID LAYOUTS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.grid2,.grid4{grid-template-columns:1fr}}

/* CARD */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--s2);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:700}
.card-body{padding:14px 16px}

/* WEEKLY */
.weekly-chart{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:20px}
.week-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.week-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.week-bar{width:72%;border-radius:4px 4px 0 0;transition:height .5s ease;background:var(--accent)}
.week-bar.sel{background:var(--green)}
.week-day{font-size:10px;color:var(--textm)}
.week-val{font-size:10px;color:var(--textd);font-weight:600}

/* PLATFORM */
.plat-list{display:flex;flex-direction:column;gap:4px}
.plat-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(42,47,69,.3)}
.plat-row:last-child{border-bottom:none}
.ptag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:700;min-width:58px;text-align:center}
.ptag-쿠팡{background:rgba(240,91,106,.15);color:#f05b6a}
.ptag-위메프{background:rgba(79,124,255,.15);color:#7b9fff}
.ptag-도매꾹{background:rgba(245,197,24,.15);color:#d4a800}
.ptag-ESM{background:rgba(62,207,142,.15);color:#3ecf8e}
.ptag-네이버{background:rgba(62,207,142,.2);color:#1db870}
.ptag-오너클랜{background:rgba(255,140,66,.15);color:#ff8c42}
.ptag-인터파크{background:rgba(155,106,240,.15);color:#a97bff}
.ptag-기타{background:var(--s3);color:var(--textd)}
.plat-name{width:68px;flex-shrink:0}
.plat-bar-wrap{flex:1}
.plat-nums{text-align:right;font-size:12px;color:var(--textd);white-space:nowrap}
.plat-nums strong{color:var(--text)}

/* COMPARE / MONTH BOXES */
.compare-box{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.compare-title{font-size:11px;font-weight:700;color:var(--textm);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.compare-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(42,47,69,.22)}
.compare-item:last-child{border-bottom:none}
.compare-item-label{font-size:12px;color:var(--textd)}
.compare-item-val{font-size:12px;font-weight:700;color:var(--text)}

/* PRODUCT TABLE */
.prod-tbl{width:100%;border-collapse:collapse;font-size:12px}
.prod-tbl th{padding:7px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--textm);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--s2);white-space:nowrap}
.prod-tbl td{padding:7px 10px;border-bottom:1px solid rgba(42,47,69,.3);color:var(--textd);vertical-align:middle}
.prod-tbl tr:last-child td{border-bottom:none}
.prod-tbl tr:hover td{background:var(--s2);color:var(--text)}

/* ORDER TABLE */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--rs)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--s2);position:sticky;top:0}
th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--textm);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid rgba(42,47,69,.4);color:var(--textd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2);color:var(--text)}
.td-name{font-weight:600;color:var(--text)}

/* SETTINGS */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){.set-grid{grid-template-columns:1fr}}
.set-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.set-head{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--s2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.set-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.set-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.set-key{font-size:12px;color:var(--textd);width:130px;flex-shrink:0}
.set-input{background:var(--s2);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:5px 10px;font-size:13px;font-family:inherit;outline:none;flex:1;transition:border-color .15s;min-width:60px}
.set-input:focus{border-color:var(--accent)}
.set-hint{font-size:11px;color:var(--textm);white-space:nowrap}
.set-add-btn{background:var(--accentd);color:var(--accent2);border:1px solid rgba(79,124,255,.3);border-radius:var(--rs);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.set-del-btn{background:var(--redd);color:var(--red);border:1px solid rgba(240,91,106,.3);border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer;font-family:inherit;flex-shrink:0}

/* MISC */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--textd);gap:10px;font-size:14px}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--s1);border:1px solid var(--border2);color:var(--text);padding:9px 16px;border-radius:var(--rs);font-size:13px;z-index:9999;opacity:0;transform:translateY(6px);transition:all .2s;pointer-events:none;display:flex;align-items:center;gap:7px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateY(0)}
.t-ok .ti{color:var(--green)}.t-err .ti{color:var(--red)}.t-info .ti{color:var(--accent2)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="login-box">
    <div class="login-logo">매출실적</div>
    <div class="login-sub">매출 대시보드 — 관리자 전용</div>
    <input class="login-input" type="password" id="pwInput" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="appWrap">
  <nav>
    <div class="nav-logo">매출실적</div>
    <button class="nav-tab active" data-page="dashboard" onclick="showPage('dashboard',this)">📊 대시보드</button>
    <button class="nav-tab" data-page="orders" onclick="showPage('orders',this)">📦 판매요약</button>
    <button class="nav-tab" data-page="settings" onclick="showPage('settings',this)">⚙ 설정</button>
    <div class="nav-sp"></div>
    <button class="nav-btn" onclick="toggleTheme()">🌙</button>
    <button class="nav-btn" onclick="doLogout()" style="margin-left:6px">로그아웃</button>
  </nav>

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="page-header">
      <div>
        <div class="page-title">📊 매출 대시보드</div>
        <div class="page-date" id="todayLabel"></div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadDashboard()">↻ 새로고침</button>
    </div>
    <div class="date-bar">
      <button class="date-btn active" id="btn-today" onclick="setDateMode('today')">오늘</button>
      <button class="date-btn" id="btn-yesterday" onclick="setDateMode('yesterday')">어제</button>
      <button class="date-btn" id="btn-custom" onclick="setDateMode('custom')">날짜 선택</button>
      <input type="date" id="customDate" class="date-input" style="display:none" onchange="loadDashboard()">
    </div>
    <div id="dashContent"><div class="loading"><div class="spinner"></div>데이터 불러오는 중...</div></div>
  </div>

  <!-- ORDERS → 상품별 요약 -->
  <div class="page" id="page-orders">
    <div class="page-header">
      <div><div class="page-title">📦 상품별 판매 요약</div></div>
      <button class="refresh-btn" id="summaryRefreshBtn" onclick="loadSummary()">&#8635; 새로고침</button>
    </div>
    <div class="date-bar">
      <button class="date-btn active" id="sbtn-today" onclick="setSummaryDate('today')">오늘</button>
      <button class="date-btn" id="sbtn-yesterday" onclick="setSummaryDate('yesterday')">어제</button>
      <button class="date-btn" id="sbtn-month" onclick="setSummaryDate('month')">이번 달</button>
      <button class="date-btn" id="sbtn-custom" onclick="setSummaryDate('custom')">날짜 선택</button>
      <input type="date" id="summaryDate" class="date-input" style="display:none" onchange="loadSummary()">
      <select id="platSummaryFilter" class="date-input" style="cursor:pointer" onchange="renderSummaryFilter()">
        <option value="">전체 사이트</option>
      </select>
    </div>
    <div id="ordersContent"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>

  <!-- SETTINGS -->
  <div class="page" id="page-settings">
    <div class="page-header">
      <div><div class="page-title">⚙ 설정</div><div class="page-date">수수료율 · 상품 · 광고비 · 기타</div></div>
      <button class="refresh-btn" onclick="saveSettings()">💾 저장</button>
    </div>
    <div class="set-grid" id="settingsContent"></div>
  </div>
</div>

<div class="toast" id="toast"><span class="ti">✓</span><span id="toastMsg"></span></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwDHZ-5xFeKjXpTwxUaq_3rdsHRDm0mGjs3PPpLxAHYCQwE8YTWk1Szz-ipBjCd8RUREQ/exec';
let authPw = '';
let dashData = null;
let settingsCache = {};
let isDark = true;
let dateMode = 'today';

// ── FETCH (JSONP 대체) ──
let _cbIdx = 0;
function gasCall(params){
  const qs = Object.entries(params)
    .map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v))
    .join('&');
  return fetch(GAS_URL+'?'+qs, {redirect:'follow'})
    .then(r => r.json())
    .catch(()=>{
      // fetch 실패 시 JSONP 폴백
      return new Promise((resolve, reject) => {
        const cbName = '_gasCb'+(++_cbIdx);
        const timeout = setTimeout(()=>{ delete window[cbName]; reject(new Error('요청 시간 초과 (10초)')); }, 10000);
        window[cbName] = (data) => { clearTimeout(timeout); delete window[cbName]; resolve(data); };
        const qsWithCb = qs+'&callback='+cbName;
        const script = document.createElement('script');
        script.src = GAS_URL+'?'+qsWithCb;
        script.onerror = ()=>{ clearTimeout(timeout); delete window[cbName]; reject(new Error('스크립트 로드 실패')); };
        document.head.appendChild(script);
        setTimeout(()=>{ try{ document.head.removeChild(script); }catch(e){} }, 15000);
      });
    });
}

// ── AUTH ──
async function doLogin(){
  const pw = document.getElementById('pwInput').value.trim();
  const err = document.getElementById('loginErr');
  if(!pw){ err.textContent='비밀번호를 입력하세요.'; return; }
  err.textContent='확인 중...';
  try {
    const data = await gasCall({action:'checkAuth', pw});
    if(data.status==='ok'){
      authPw = pw;
      document.getElementById('loginWrap').style.display='none';
      document.getElementById('appWrap').style.display='block';
      document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
      document.getElementById('customDate').value = todayStr();
      loadSettings().then(()=>loadDashboard());
    } else {
      err.textContent='비밀번호가 올바르지 않습니다.';
    }
  } catch(e){ err.textContent='연결 오류: '+e.message; }
}

function doLogout(){
  authPw='';
  document.getElementById('appWrap').style.display='none';
  document.getElementById('loginWrap').style.display='flex';
  document.getElementById('pwInput').value='';
  document.getElementById('loginErr').textContent='';
}

// ── PAGE ──
let summaryDateMode = 'today';

function showPage(id, btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='orders'){ document.getElementById('summaryDate').value=todayStr(); loadSummary(); }
  if(id==='settings') renderSettingsPage();
}

// ── THEME ──
function toggleTheme(){
  isDark=!isDark;
  document.body.classList.toggle('light',!isDark);
  document.querySelector('.nav-btn').textContent=isDark?'🌙':'☀️';
}

// ── DATE ──
function todayStr(){ return new Date().toLocaleDateString('sv-SE'); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toLocaleDateString('sv-SE'); }
function getSelectedDate(){
  if(dateMode==='today') return todayStr();
  if(dateMode==='yesterday') return yesterdayStr();
  return document.getElementById('customDate').value||todayStr();
}
function setDateMode(mode){
  dateMode=mode;
  document.querySelectorAll('.date-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+mode).classList.add('active');
  document.getElementById('customDate').style.display = mode==='custom'?'block':'none';
  if(mode!=='custom') loadDashboard();
}

// ── DASHBOARD ──
async function loadDashboard(){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true; btn.textContent='로딩 중...';
  document.getElementById('dashContent').innerHTML='<div class="loading"><div class="spinner"></div>데이터 불러오는 중...</div>';
  try {
    const selDate=getSelectedDate();
    const data=await gasCall({action:'getDashboard', pw:authPw, date:selDate});
    if(data.status!=='ok') throw new Error(data.message);
    dashData=data;
    renderDashboard(data, selDate);
  } catch(e){
    document.getElementById('dashContent').innerHTML=`<div style="color:var(--red);padding:20px">오류: ${e.message}</div>`;
  } finally {
    btn.disabled=false; btn.textContent='↻ 새로고침';
  }
}

function renderDashboard(d, selDate){
  const t=d.selected||{}, prev=d.prev||{};
  const weekly=d.weekly||[];
  const thisMonth=d.thisMonth||{}, lastMonth=d.lastMonth||{};
  const products=d.products||[];
  const isToday=selDate===todayStr();
  const selLabel=isToday?'오늘':selDate;
  const prevLabel=isToday?'어제':'전일';

  function delta(now, p, isWon){
    if(p===undefined||p===null) return '<span class="delta-eq">—</span>';
    const diff=now-p, pct=p>0?Math.round(diff/p*100):0;
    const cls=diff>0?'delta-up':diff<0?'delta-dn':'delta-eq';
    const arrow=diff>0?'▲':diff<0?'▼':'—';
    const lbl=isWon?won(Math.abs(diff)):Math.abs(diff).toLocaleString();
    return `<span class="${cls}">${arrow} ${lbl} (${Math.abs(pct)}%)</span>`;
  }

  const maxOrders=Math.max(...weekly.map(w=>w.orders||0),1);

  document.getElementById('dashContent').innerHTML=`
    <!-- KPI 6개 -->
    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="kpi-label">주문 건수</div>
        <div class="kpi-value">${(t.orders||0).toLocaleString()}<span style="font-size:12px;font-weight:400">건</span></div>
        <div class="kpi-delta">${prevLabel} 대비 ${delta(t.orders||0,prev.orders||0)}</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">판매 수량</div>
        <div class="kpi-value">${(t.qty||0).toLocaleString()}<span style="font-size:12px;font-weight:400">개</span></div>
        <div class="kpi-delta">${prevLabel} 대비 ${delta(t.qty||0,prev.qty||0)}</div>
      </div>
      <div class="kpi-card yellow">
        <div class="kpi-label">매출 (수수료 전)</div>
        <div class="kpi-value" style="font-size:15px">${won(t.revenue||0)}</div>
        <div class="kpi-delta">${prevLabel} 대비 ${delta(t.revenue||0,prev.revenue||0,true)}</div>
      </div>
      <div class="kpi-card purple">
        <div class="kpi-label">기부금 (매출 ${Math.round((t.donationRate||0.3)*100)}%)</div>
        <div class="kpi-value" style="font-size:15px">${won(t.donation||0)}</div>
        <div class="kpi-delta" style="color:var(--textm)">매출의 ${Math.round((t.donationRate||0.3)*100)}%</div>
      </div>
      <div class="kpi-card orange">
        <div class="kpi-label">광고비 합산 (월)</div>
        <div class="kpi-value" style="font-size:15px">${won(t.adCost||0)}</div>
        <div class="kpi-delta" style="color:var(--textm)">일 ${won(t.adCostDaily||0)} × ${t.daysInMonth||30}일</div>
      </div>
      <div class="kpi-card red">
        <div class="kpi-label">실수익</div>
        <div class="kpi-value" style="font-size:15px">${won(t.net||0)}</div>
        <div class="kpi-delta">${prevLabel} 대비 ${delta(t.net||0,prev.net||0,true)}</div>
      </div>
    </div>

    <!-- 4열 비교 박스 -->
    <div class="grid4" style="margin-bottom:16px">
      ${[
        {title:'📅 '+selLabel, data:t, adLabel:'광고비'},
        {title:'📅 '+prevLabel, data:prev, adLabel:'광고비'},
        {title:'📆 이번 달', data:thisMonth, adLabel:'광고비'},
        {title:'📆 지난 달', data:lastMonth, adLabel:'광고비'}
      ].map(({title,data:x})=>`
        <div class="compare-box">
          <div class="compare-title">${title}</div>
          <div class="compare-item"><span class="compare-item-label">주문 건수</span><span class="compare-item-val">${(x.orders||0).toLocaleString()}건</span></div>
          <div class="compare-item"><span class="compare-item-label">판매 수량</span><span class="compare-item-val">${(x.qty||0).toLocaleString()}개</span></div>
          <div class="compare-item"><span class="compare-item-label">총 매출</span><span class="compare-item-val" style="color:var(--yellow)">${won(x.revenue||0)}</span></div>
          <div class="compare-item"><span class="compare-item-label">원가</span><span class="compare-item-val" style="color:var(--red)">-${won(x.costTotal||0)}</span></div>
          <div class="compare-item"><span class="compare-item-label">기부금</span><span class="compare-item-val" style="color:var(--purple)">-${won(x.donation||0)}</span></div>
          <div class="compare-item"><span class="compare-item-label">수수료</span><span class="compare-item-val" style="color:var(--red)">-${won(x.fee||0)}</span></div>
          <div class="compare-item"><span class="compare-item-label">광고비</span><span class="compare-item-val" style="color:var(--orange)">-${won(x.adCost||0)}</span></div>
          <div class="compare-item"><span class="compare-item-label">배송비</span><span class="compare-item-val" style="color:var(--red)">-${won(x.deliveryCost||0)}</span></div>
          <div class="compare-item" style="border-top:1px solid var(--border2);margin-top:4px;padding-top:6px"><span class="compare-item-label" style="font-weight:700;color:var(--text)">실수익</span><span class="compare-item-val" style="color:var(--green);font-size:13px">${won(x.net||0)}</span></div>
        </div>`).join('')}
    </div>

    <!-- 7일 추이 + 쇼핑몰별 -->
    <div class="grid2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-head"><div class="card-title">📈 7일 주문 추이</div></div>
        <div class="card-body">
          <div class="weekly-chart">
            ${weekly.map(w=>{
              const maxH = 80;
              const h = maxOrders>0 ? Math.max(Math.round((w.orders||0)/maxOrders*maxH), (w.orders>0?4:0)) : 0;
              const isSel=w.date===selDate;
              return`<div class="week-col">
                <div class="week-val">${w.orders||0}</div>
                <div class="week-bar-wrap"><div class="week-bar${isSel?' sel':''}" style="height:${h}px"></div></div>
                <div class="week-day">${w.date?w.date.slice(5):'—'}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">🏪 쇼핑몰별 실적 (누적)</div></div>
        <div class="card-body">
          <div class="plat-list">
            ${(d.platforms||[]).slice(0,7).map(p=>{
              const maxO=Math.max(...(d.platforms||[]).map(x=>x.orders),1);
              const pct=Math.round(p.orders/maxO*100);
              return`<div class="plat-row">
                <div class="plat-name"><span class="ptag ptag-${p.name||'기타'}">${p.name||'기타'}</span></div>
                <div class="plat-bar-wrap">
                  <div style="background:var(--s3);border-radius:3px;height:14px;overflow:hidden">
                    <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:3px;opacity:.7"></div>
                  </div>
                </div>
                <div class="plat-nums"><strong>${p.orders}</strong>건 · ${won(p.revenue||0)}</div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

// ── SUMMARY (상품별 판매 요약) ──
let summaryData = null;

function getSummaryDate(){
  if(summaryDateMode==='today') return todayStr();
  if(summaryDateMode==='yesterday') return yesterdayStr();
  if(summaryDateMode==='month') return 'month:'+todayStr().slice(0,7);
  return document.getElementById('summaryDate').value||todayStr();
}
function setSummaryDate(mode){
  summaryDateMode=mode;
  document.querySelectorAll('[id^="sbtn-"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('sbtn-'+mode).classList.add('active');
  document.getElementById('summaryDate').style.display=mode==='custom'?'block':'none';
  if(mode!=='custom') loadSummary();
}

async function loadSummary(){
  const btn=document.getElementById('summaryRefreshBtn');
  btn.disabled=true; btn.textContent='로딩 중...';
  document.getElementById('ordersContent').innerHTML='<div class="loading"><div class="spinner"></div>불러오는 중...</div>';
  try {
    const sel=getSummaryDate();
    const isMonth=sel.startsWith('month:');
    const params={action: isMonth?'getMonthSummary':'getDashboard', pw:authPw};
    if(isMonth) params.month=sel.slice(6);
    else params.date=sel;
    const data=await gasCall(params);
    if(data.status!=='ok') throw new Error(data.message);
    summaryData=data;
    // 사이트 드롭박스 업데이트
    const prods = data.products||[];
    const platforms=[...new Set(prods.map(p=>p.platform||'').filter(Boolean))].sort();
    const sel2=document.getElementById('platSummaryFilter');
    const cur=sel2.value;
    sel2.innerHTML='<option value="">전체 사이트</option>'+platforms.map(p=>`<option value="${esc(p)}"${p===cur?'selected':''}>${esc(p)}</option>`).join('');
    renderSummaryFilter();
  } catch(e){
    document.getElementById('ordersContent').innerHTML=`<div style="color:var(--red);padding:20px">오류: ${e.message}</div>`;
  } finally {
    btn.disabled=false; btn.textContent='↻ 새로고침';
  }
}

function renderSummaryFilter(){
  if(!summaryData) return;
  const platFilter=document.getElementById('platSummaryFilter').value;
  const sel=getSummaryDate();
  const isMonth=sel.startsWith('month:');
  renderSummary(summaryData, sel, platFilter, isMonth);
}

function renderSummary(d, selDate, platFilter, isMonth){
  const selStat = d.selected||d.monthStat||{};
  let products = d.products||[];
  const prevProds = d.prevProducts||[];
  const prodCols = getProdCols();

  // 사이트 필터
  if(platFilter) products=products.filter(p=>p.platform===platFilter);

  const prevMap = {};
  prevProds.forEach(p=>{
    const colKey=prodCols.map((c,i)=>p.cols&&p.cols['col'+(i+1)]||'').join('|');
    prevMap[p.name+'__'+colKey+'__'+(p.platform||'')]=p.qty||0;
  });

  if(!products.length){
    document.getElementById('ordersContent').innerHTML=`<div style="text-align:center;padding:60px;color:var(--textm)">해당 기간 판매 데이터가 없습니다</div>`;
    return;
  }

  const isToday=selDate===todayStr();
  const dateLabel=isMonth?'이번 달':isToday?'오늘':selDate;
  const prevLabel=isMonth?'':isToday?'어제':'전일';

  let html=`<div style="margin-bottom:12px;font-size:12px;color:var(--textm)">
    ${dateLabel} 총 <strong style="color:var(--text)">${(selStat.orders||0).toLocaleString()}건</strong> ·
    <strong style="color:var(--text)">${(selStat.qty||0).toLocaleString()}개</strong> ·
    매출 <strong style="color:var(--yellow)">${won(selStat.revenue||0)}</strong> ·
    기부 <strong style="color:var(--purple)">${won(selStat.donation||0)}</strong> ·
    실수익 <strong style="color:var(--green)">${won(selStat.net||0)}</strong>
  </div>`;

  const grouped={};
  products.forEach(p=>{ if(!grouped[p.name]) grouped[p.name]=[]; grouped[p.name].push(p); });

  const thStyle='padding:7px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--textm);border-bottom:1px solid var(--border);white-space:nowrap';
  const colHeaders=prodCols.map(c=>`<th style="${thStyle}">${esc(c.label)}</th>`).join('');

  Object.entries(grouped).forEach(([prodName, rows])=>{
    const totalQty=rows.reduce((s,r)=>s+(r.qty||0),0);
    const totalAmt=rows.reduce((s,r)=>s+(r.price||0)*(r.qty||0),0);

    // 사이트별 소계
    const siteMap={};
    rows.forEach(r=>{
      const site=r.platform||'기타';
      if(!siteMap[site]) siteMap[site]={qty:0,amt:0};
      siteMap[site].qty+=(r.qty||0);
      siteMap[site].amt+=(r.price||0)*(r.qty||0);
    });
    const siteSummary=Object.entries(siteMap).map(([site,v])=>
      `<span class="ptag ptag-${site}" style="margin-right:4px">${esc(site)}</span><span style="color:var(--text);font-size:11px">${v.qty}개 · ${won(v.amt)}</span>`
    ).join('<span style="color:var(--border2);margin:0 8px">|</span>');

    html+=`
    <div style="background:var(--s1);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden">
      <div style="padding:10px 16px;background:var(--s2);border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${Object.keys(siteMap).length>1?'6px':'0'}">
          <div style="font-size:14px;font-weight:700;color:var(--text)">${esc(prodName)}</div>
          <div style="font-size:12px;color:var(--textd)">합계 <strong style="color:var(--text)">${totalQty.toLocaleString()}개</strong> · <strong style="color:var(--yellow)">${won(totalAmt)}</strong></div>
        </div>
        ${Object.keys(siteMap).length>0?`<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:11px">${siteSummary}</div>`:''}
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="background:var(--s2)">
            ${colHeaders}
            <th style="${thStyle}">사이트</th>
            <th style="${thStyle};text-align:right">판매수량</th>
            <th style="${thStyle};text-align:right">${isMonth?'':'전날대비'}</th>
            <th style="${thStyle};text-align:right">총금액</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>{
              const colKey=prodCols.map((c,i)=>r.cols&&r.cols['col'+(i+1)]||'').join('|');
              const prevQty=prevMap[r.name+'__'+colKey+'__'+(r.platform||'')]||0;
              const diff=(r.qty||0)-prevQty;
              const diffHtml=isMonth?'—':diff>0?`<span style="color:var(--green)">▲${diff}</span>`:diff<0?`<span style="color:var(--red)">▼${Math.abs(diff)}</span>`:`<span style="color:var(--textm)">—</span>`;
              const colCells=prodCols.map((c,i)=>`<td style="padding:8px 12px;color:var(--textd)">${esc(r.cols&&r.cols['col'+(i+1)]||'—')}</td>`).join('');
              return`<tr style="border-bottom:1px solid rgba(42,47,69,.25)">
                ${colCells}
                <td style="padding:8px 12px">${r.platform?`<span class="ptag ptag-${r.platform}">${esc(r.platform)}</span>`:'<span style="color:var(--textm)">—</span>'}</td>
                <td style="padding:8px 12px;text-align:right;font-weight:700;color:var(--text)">${(r.qty||0).toLocaleString()}</td>
                <td style="padding:8px 12px;text-align:right">${diffHtml}</td>
                <td style="padding:8px 12px;text-align:right;color:var(--yellow);font-weight:600">${won((r.price||0)*(r.qty||0))}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  });

  document.getElementById('ordersContent').innerHTML=html;
}

// ── SETTINGS ──
async function loadSettings(){
  try {
    const data=await gasCall({action:'getSettings'});
    if(data.status==='ok') settingsCache=data.settings||{};
  } catch(e){}
}

function getAds(){
  const ads=[]; let i=1;
  while(settingsCache['광고비_'+i+'_이름']!==undefined){
    ads.push({name:settingsCache['광고비_'+i+'_이름']||'', amount:settingsCache['광고비_'+i+'_금액']||0});
    i++;
  }
  return ads;
}
function getProducts(){
  const prods=[]; let i=1;
  while(settingsCache['상품_'+i+'_이름']!==undefined){
    prods.push({
      name:settingsCache['상품_'+i+'_이름']||'',
      option:settingsCache['상품_'+i+'_옵션']||'',
      color:settingsCache['상품_'+i+'_색상']||'',
      price:settingsCache['상품_'+i+'_금액']||0,
      cost:settingsCache['상품_'+i+'_원가']||0
    });
    i++;
  }
  return prods;
}

function getFees(){
  const fixed=['쿠팡','위메프','도매꾹','ESM','네이버','오너클랜','인터파크'];
  // 삭제된 항목 제외
  const deleted = (settingsCache['수수료_삭제목록']||'').split(',').filter(Boolean);
  const fees = fixed
    .filter(name=>!deleted.includes(name))
    .map(name=>({name, rate:Number(settingsCache[name+'_수수료율']||0), fixed:true}));
  // 동적 추가분
  let i=1;
  while(settingsCache['수수료_'+i+'_이름']!==undefined){
    fees.push({name:settingsCache['수수료_'+i+'_이름']||'', rate:Number(settingsCache['수수료_'+i+'_율']||0), custom:true, idx:i});
    i++;
  }
  return fees;
}
function getDeliveries(){
  const list=[]; let i=1;
  while(settingsCache['배송비_'+i+'_이름']!==undefined){
    list.push({
      name: settingsCache['배송비_'+i+'_이름']||'',
      fee:  Number(settingsCache['배송비_'+i+'_금액']||0),
      remote: Number(settingsCache['배송비_'+i+'_도서산간']||0)
    });
    i++;
  }
  if(!list.length && settingsCache['배송비']){
    list.push({name:'기본 배송비', fee:Number(settingsCache['배송비']||3000), remote:0});
  }
  return list;
}

// 상품 컬럼 정의 가져오기 (설정에서 자유 추가/삭제)
function getProdCols(){
  // 기본 컬럼: 이름, 금액, 원가는 고정. 나머지는 동적
  const cols=[]; let i=1;
  while(settingsCache['상품컬럼_'+i+'_이름']!==undefined){
    cols.push({label:settingsCache['상품컬럼_'+i+'_이름']||'', key:'col'+i});
    i++;
  }
  // 처음 사용시 기본값
  if(!cols.length){
    cols.push({label:'옵션', key:'col1'});
  }
  return cols;
}

function getProducts(){
  const prods=[]; let i=1;
  while(settingsCache['상품_'+i+'_이름']!==undefined){
    const p={
      name:  settingsCache['상품_'+i+'_이름']||'',
      price: Number(settingsCache['상품_'+i+'_금액']||0),
      cost:  Number(settingsCache['상품_'+i+'_원가']||0),
      cols:  {} // 동적 컬럼값
    };
    let c=1;
    while(settingsCache['상품컬럼_'+c+'_이름']!==undefined){
      p.cols['col'+c] = settingsCache['상품_'+i+'_col'+c]||'';
      c++;
    }
    prods.push(p);
    i++;
  }
  return prods;
}

          <div class="set-row" style="flex-wrap:wrap">
            <input class="set-input" type="text" placeholder="택배사명" value="${esc(d.name)}" data-key="배송비_${i+1}_이름" style="max-width:110px">
            <input class="set-input" type="number" placeholder="기본배송비" value="${d.fee}" data-key="배송비_${i+1}_금액" style="max-width:100px">
            <span class="set-hint">원</span>
            <input class="set-input" type="number" placeholder="도서산간" value="${d.remote}" data-key="배송비_${i+1}_도서산간" style="max-width:100px">

    <!-- 기부율 -->
    <div class="set-card">
      <div class="set-head">🎁 기부율</div>
      <div class="set-body">
        <div class="set-row">
          <div class="set-key">기부율</div>
          <input class="set-input" type="number" step="0.01" min="0" max="1"

            data-key="기부율" placeholder="0.30">
          <span class="set-hint">× 100 = % (기본 30%)</span>
        </div>

    <!-- 광고비 -->

      <div class="set-head">

        <div style="display:flex;gap:6px">
          <button class="set-add-btn" onclick="addAd()">+ 추가</button>
          <button class="set-add-btn" onclick="downloadExcel('ad')">&#11015; 엑셀</button>
          <label class="set-add-btn" style="cursor:pointer">&#11014; 업로드<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="uploadExcel(event,'ad')"></label>

      </div>
      <div class="set-body" id="adList">
        ${ads.length===0
          ?'<div style="color:var(--textm);font-size:12px;padding:4px 0">등록된 광고비 없음</div>'
          :ads.map((a,i)=>`
          <div class="set-row" data-ad="${i+1}">
            <input class="set-input" type="text" placeholder="광고명" value="${esc(a.name)}" data-key="광고비_${i+1}_이름" style="max-width:200px">
            <input class="set-input" type="number" placeholder="일 광고비" value="${a.amount}" data-key="광고비_${i+1}_금액" style="max-width:130px">
            <span class="set-hint">원/일</span>
            <button class="set-del-btn" onclick="delAd(${i+1})">삭제</button>
          </div>`).join('')}
      </div>
    </div>

    <!-- 상품 컬럼 설정 -->
    <div class="set-card">
      <div class="set-head">
        🗂 상품 컬럼 설정
        <button class="set-add-btn" onclick="addProdCol()">+ 컬럼 추가</button>
      </div>
      <div class="set-body">
        <div style="font-size:11px;color:var(--textm);margin-bottom:6px">상품명 / 판매가 / 원가는 고정. 아래에서 추가 컬럼을 정의하세요.</div>
        ${prodCols.length===0
          ?'<div style="color:var(--textm);font-size:12px">컬럼 없음</div>'
          :prodCols.map((c,i)=>`
          <div class="set-row">
            <input class="set-input" type="text" placeholder="컬럼명 (예: 옵션, 색상)" value="${esc(c.label)}" data-key="상품컬럼_${i+1}_이름">
            <button class="set-del-btn" onclick="delProdCol(${i+1})">삭제</button>
          </div>`).join('')}
      </div>
    </div>

    <!-- 상품 목록 -->
    <div class="set-card" style="grid-column:1/-1">
      <div class="set-head">
        📦 상품 목록
        <div style="display:flex;gap:6px">
          <button class="set-add-btn" onclick="addProduct()">+ 추가</button>
          <button class="set-add-btn" onclick="downloadExcel('product')">&#11015; 엑셀</button>
          <label class="set-add-btn" style="cursor:pointer">&#11014; 업로드<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="uploadExcel(event,'product')"></label>
        </div>
      </div>
      <div style="font-size:11px;color:var(--textm);padding:8px 16px 0">
        ⚠ 상품명은 구글시트 E열(상품명)과 정확히 일치해야 매출이 계산됩니다.
      </div>
      <div class="set-body" id="prodList">
        ${prods.length===0
          ?'<div style="color:var(--textm);font-size:12px;padding:4px 0">등록된 상품 없음</div>'
          :`<div class="set-row" style="font-size:10px;color:var(--textm);padding-bottom:4px;border-bottom:1px solid var(--border);font-weight:700">
              <span style="min-width:140px">상품명 (시트 E열 일치)</span>
              ${prodCols.map(c=>`<span style="min-width:80px">${esc(c.label)}</span>`).join('')}
              <span style="min-width:100px">판매가(원)</span>
              <span style="min-width:100px">원가(원)</span>
            </div>
            ${prods.map((p,i)=>`
            <div class="set-row" data-prod="${i+1}" style="flex-wrap:wrap">
              <input class="set-input" type="text" placeholder="상품명" value="${esc(p.name)}" data-key="상품_${i+1}_이름" style="min-width:140px">
              ${prodCols.map((c,ci)=>`
                <input class="set-input" type="text" placeholder="${esc(c.label)}" value="${esc(p.cols['col'+(ci+1)]||'')}" data-key="상품_${i+1}_col${ci+1}" style="max-width:90px">`).join('')}
              <input class="set-input" type="number" placeholder="판매가" value="${p.price}" data-key="상품_${i+1}_금액" style="max-width:100px">
              <input class="set-input" type="number" placeholder="원가" value="${p.cost}" data-key="상품_${i+1}_원가" style="max-width:100px">
              <button class="set-del-btn" onclick="delProduct(${i+1})">삭제</button>
            </div>`).join('')}`}
      </div>
    </div>
  `;
}

function delFixedFee(name){
  syncSettingsFromInputs();
  const deleted=(settingsCache['수수료_삭제목록']||'').split(',').filter(Boolean);
  if(!deleted.includes(name)) deleted.push(name);
  settingsCache['수수료_삭제목록']=deleted.join(',');
  renderSettingsPage();
}
function addFee(){
  syncSettingsFromInputs();
  // 커스텀 수수료 개수 파악
  let i=1; while(settingsCache['수수료_'+i+'_이름']!==undefined) i++;
  settingsCache['수수료_'+i+'_이름']=''; settingsCache['수수료_'+i+'_율']=0;
  renderSettingsPage();
}
function delFee(idx){
  syncSettingsFromInputs();
  // 해당 idx 삭제 후 재번호
  const customs=[];
  let i=1;
  while(settingsCache['수수료_'+i+'_이름']!==undefined){
    if(i!==idx) customs.push({name:settingsCache['수수료_'+i+'_이름'], rate:settingsCache['수수료_'+i+'_율']});
    delete settingsCache['수수료_'+i+'_이름']; delete settingsCache['수수료_'+i+'_율'];
    i++;
  }
  customs.forEach((c,j)=>{ settingsCache['수수료_'+(j+1)+'_이름']=c.name; settingsCache['수수료_'+(j+1)+'_율']=c.rate; });
  renderSettingsPage();
}
function addProdCol(){
  syncSettingsFromInputs();
  const cols=getProdCols(); const n=cols.length+1;
  settingsCache['상품컬럼_'+n+'_이름']='';
  renderSettingsPage();
}
function delProdCol(idx){
  syncSettingsFromInputs();
  const cols=getProdCols(); cols.splice(idx-1,1);
  // 컬럼 키 재번호
  let i=1; while(settingsCache['상품컬럼_'+i+'_이름']!==undefined){ delete settingsCache['상품컬럼_'+i+'_이름']; i++; }
  cols.forEach((c,j)=>{ settingsCache['상품컬럼_'+(j+1)+'_이름']=c.label; });
  renderSettingsPage();
}
function addDelivery(){
  syncSettingsFromInputs();
  const list=getDeliveries(); const n=list.length+1;
  settingsCache['배송비_'+n+'_이름']=''; settingsCache['배송비_'+n+'_금액']=3000; settingsCache['배송비_'+n+'_도서산간']=0;
  renderSettingsPage();
}
function delDelivery(idx){
  syncSettingsFromInputs();
  const list=getDeliveries(); list.splice(idx-1,1);
  let i=1; while(settingsCache['배송비_'+i+'_이름']!==undefined){ delete settingsCache['배송비_'+i+'_이름']; delete settingsCache['배송비_'+i+'_금액']; delete settingsCache['배송비_'+i+'_도서산간']; i++; }
  list.forEach((d,j)=>{ settingsCache['배송비_'+(j+1)+'_이름']=d.name; settingsCache['배송비_'+(j+1)+'_금액']=d.fee; settingsCache['배송비_'+(j+1)+'_도서산간']=d.remote; });
  renderSettingsPage();
}

// ── 엑셀 다운로드 ──
function downloadExcel(type){
  let rows=[], filename='';
  if(type==='fee'){
    filename='수수료율.csv';
    rows=[['쇼핑몰','수수료율(소수)','수수료율(%)']];
    ['쿠팡','위메프','도매꾹','ESM','네이버','오너클랜','인터파크'].forEach(p=>{
      const v=Number(settingsCache[p+'_수수료율']||0);
      rows.push([p, v.toFixed(3), (v*100).toFixed(1)+'%']);
    });
  } else if(type==='ad'){
    filename='광고비.csv';
    rows=[['광고명','일광고비(원)']];
    getAds().forEach(a=>rows.push([a.name, a.amount]));
  } else if(type==='product'){
    filename='상품목록.csv';
    rows=[['상품명','옵션','색상','판매가(원)','원가(원)']];
    getProducts().forEach(p=>rows.push([p.name, p.option, p.color, p.price, p.cost]));
  }
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const bom='\uFEFF'; // UTF-8 BOM (엑셀 한글 깨짐 방지)
  const blob=new Blob([bom+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
  toast(filename+' 다운로드 완료','ok');
}

// ── 엑셀 업로드 ──
function uploadExcel(event, type){
  const file=event.target.files[0];
  if(!file){ return; }
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const text=e.target.result;
      // BOM 제거
      const clean=text.replace(/^\uFEFF/,'');
      const lines=clean.split(/\r?\n/).filter(l=>l.trim());
      if(lines.length<2){ toast('데이터가 없습니다 (헤더 제외 1행 이상 필요)','err'); return; }
      // CSV 파싱 (따옴표 처리)
      function parseCSVLine(line){
        const result=[]; let cur='', inQ=false;
        for(let i=0;i<line.length;i++){
          const c=line[i];
          if(c==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;} }
          else if(c===','&&!inQ){ result.push(cur.trim()); cur=''; }
          else cur+=c;
        }
        result.push(cur.trim());
        return result;
      }
      const dataRows=lines.slice(1).map(parseCSVLine);

      syncSettingsFromInputs();

      if(type==='fee'){
        // 컬럼: 쇼핑몰, 수수료율(소수), ...
        dataRows.forEach(r=>{
          const name=(r[0]||'').trim();
          const val=parseFloat(r[1])||0;
          if(name) settingsCache[name+'_수수료율']=val;
        });
        toast('수수료율 업로드 완료 — 저장 버튼을 눌러주세요','ok');
      } else if(type==='ad'){
        // 컬럼: 광고명, 일광고비
        clearKeys('광고비');
        dataRows.forEach((r,i)=>{
          const name=(r[0]||'').trim();
          const amount=parseFloat(r[1])||0;
          if(name){
            settingsCache['광고비_'+(i+1)+'_이름']=name;
            settingsCache['광고비_'+(i+1)+'_금액']=amount;
          }
        });
        toast('광고비 업로드 완료 — 저장 버튼을 눌러주세요','ok');
      } else if(type==='product'){
        // 컬럼: 상품명, 옵션, 색상, 판매가, 원가
        clearKeys('상품');
        dataRows.forEach((r,i)=>{
          const name=(r[0]||'').trim();
          if(name){
            settingsCache['상품_'+(i+1)+'_이름']=name;
            settingsCache['상품_'+(i+1)+'_옵션']=(r[1]||'').trim();
            settingsCache['상품_'+(i+1)+'_색상']=(r[2]||'').trim();
            settingsCache['상품_'+(i+1)+'_금액']=parseFloat(r[3])||0;
            settingsCache['상품_'+(i+1)+'_원가']=parseFloat(r[4])||0;
          }
        });
        toast('상품 업로드 완료 — 저장 버튼을 눌러주세요','ok');
      }
      renderSettingsPage();
    } catch(err){
      toast('파일 파싱 오류: '+err.message,'err');
    }
  };
  reader.readAsText(file,'UTF-8');
  event.target.value=''; // 같은 파일 재업로드 허용
}

function addAd(){
  syncSettingsFromInputs();
  const n=getAds().length+1;
  settingsCache['광고비_'+n+'_이름']='';
  settingsCache['광고비_'+n+'_금액']=0;
  renderSettingsPage();
}
function delAd(idx){
  syncSettingsFromInputs();
  const ads=getAds(); ads.splice(idx-1,1);
  clearKeys('광고비');
  ads.forEach((a,j)=>{ settingsCache['광고비_'+(j+1)+'_이름']=a.name; settingsCache['광고비_'+(j+1)+'_금액']=a.amount; });
  renderSettingsPage();
}
function addProduct(){
  syncSettingsFromInputs();
  const n=getProducts().length+1;
  settingsCache['상품_'+n+'_이름']=''; settingsCache['상품_'+n+'_금액']=0; settingsCache['상품_'+n+'_원가']=0;
  const cols=getProdCols();
  cols.forEach((c,i)=>{ settingsCache['상품_'+n+'_col'+(i+1)]=''; });
  renderSettingsPage();
}
function delProduct(idx){
  syncSettingsFromInputs();
  const prods=getProducts(); prods.splice(idx-1,1);
  const cols=getProdCols();
  // 기존 키 전부 삭제
  let i=1;
  while(settingsCache['상품_'+i+'_이름']!==undefined){
    delete settingsCache['상품_'+i+'_이름']; delete settingsCache['상품_'+i+'_금액']; delete settingsCache['상품_'+i+'_원가'];
    cols.forEach((c,ci)=>{ delete settingsCache['상품_'+i+'_col'+(ci+1)]; });
    i++;
  }
  prods.forEach((p,j)=>{
    settingsCache['상품_'+(j+1)+'_이름']=p.name;
    settingsCache['상품_'+(j+1)+'_금액']=p.price;
    settingsCache['상품_'+(j+1)+'_원가']=p.cost;
    cols.forEach((c,ci)=>{ settingsCache['상품_'+(j+1)+'_col'+(ci+1)]=p.cols['col'+(ci+1)]||''; });
  });
  renderSettingsPage();
}
function clearKeys(prefix){
  Object.keys(settingsCache).filter(k=>k.startsWith(prefix+'_')).forEach(k=>delete settingsCache[k]);
}
function syncSettingsFromInputs(){
  document.querySelectorAll('#settingsContent .set-input').forEach(inp=>{ if(inp.dataset.key) settingsCache[inp.dataset.key]=inp.value; });
}

async function saveSettings(){
  syncSettingsFromInputs();
  try {
    const data=await gasCall({action:'saveSettings', pw:authPw, settings:JSON.stringify(settingsCache)});
    toast(data&&data.status==='ok'?'설정 저장 완료 — 대시보드 갱신 중...':'로컬 저장 완료 — 대시보드 갱신 중...','ok');
  } catch(e){
    toast('로컬 저장 완료 (GAS 연결 불가) — 대시보드 갱신 중...','info');
  }
  renderSettingsPage();
  loadDashboard();
}

// ── UTILS ──
function won(n){ return Math.round(n||0).toLocaleString()+'원'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg, type='info'){
  const t=document.getElementById('toast');
  const icons={ok:'✓',err:'✗',info:'ℹ'};
  t.className='toast t-'+(type==='ok'?'ok':type==='err'?'err':'info');
  document.querySelector('.toast .ti').textContent=icons[type]||'ℹ';
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800);
}
